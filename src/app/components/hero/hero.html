<section class="hero" id="top">
  <div class="hero__inner u-shell">
    <div class="hero__top">
      <span class="u-mono hero__tag a-fade" style="--d: 0ms">
        Portfolio — {{ year }}
      </span>
      <span class="u-mono hero__tag hero__tag--right a-fade" style="--d: 80ms">
        {{ profile.roles.join(' / ') }}
      </span>
    </div>

    <h1 class="hero__title u-display">
      <span class="hero__line"><span class="hero__line-in" style="--d: 120ms">{{ profile.first }}</span></span>
      <span class="hero__line"
        ><span class="hero__line-in" style="--d: 220ms"
          >{{ profile.last }}<span class="hero__accent">.</span></span
        ></span
      >
    </h1>

    <div class="hero__foot">
      <p class="hero__lede a-fade" style="--d: 420ms">{{ profile.tagline }}</p>
      <a class="hero__scroll u-mono a-fade" href="#work" style="--d: 520ms">
        <span>Scroll</span>
        <span class="hero__scroll-line" aria-hidden="true"></span>
      </a>
    </div>
  </div>

  <div class="hero__stack a-fade" style="--d: 620ms">
    <div class="hero__stack-inner u-shell">
      <span class="hero__stack-label u-mono">Toolkit</span>
      <ul class="hero__chips">
        @for (item of stack; track item) {
          <li class="hero__chip u-mono">{{ item }}</li>
        }
      </ul>
    </div>
  </div>
</section>
